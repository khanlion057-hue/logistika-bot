# Render "Blueprint" (ixtiyoriy). Qo'lda sozlash qadamlari README.md da.
services:
  - type: web
    name: logistika-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Quyidagilar maxfiy: qiymatini Render panelida o'zingiz kiritasiz (faylda yozilmaydi)
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COLLECT_CHAT_ID
        sync: false
      - key: LOAD_CHAT_ID
        sync: false
