# Render bepul rejasi 15 daqiqa jim tursa uxlaydi. Bu fayl har 5 daqiqada /health ga so'rov yuborib, uyg'oq tutadi.
# Kerak: GitHub -> Settings -> Secrets and variables -> Actions -> RENDER_URL = https://BOTNOMI.onrender.com
name: ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # qo'lda ham ishga tushirsa bo'ladi (Actions -> ping -> Run workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: /health ga so'rov
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then echo "RENDER_URL secret kiritilmagan"; exit 1; fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 "${RENDER_URL%/}/health"
          echo
